<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закажи сервис - Мото Сервис Kumanovo</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>
    <header>
        <h1>Мото Сервис Kumanovo</h1>
        <nav>
            <a href="index.html">Почетна</a>
            <a href="rezervacija.html">Закажи</a>
        </nav>
    </header>

    <section id="rezervacija" class="section">
    <h2>Закажи сервис</h2>
  <form action="" onsubmit="sendEmail(); return false;" class="reservation-form">
    <label for="ime">Име и Презиме:</label>
    <input type="text" id="ime" required>

    <label for="email">Е-пошта:</label>
    <input type="email" id="email" required>

    <label for="telefon">Телефон:</label>
    <input type="tel" id="telefon" required>

    <label for="datum">Датум на закажување:</label>
    <input type="date" id="datum" required>

    <label for="tip">Тип на сервис:</label>
    <select id="tip">
        <option value="Редовен сервис">Редовен сервис</option>
        <option value="Поправка">Поправка</option>
        <option value="Дијагностика">Дијагностика</option>
    </select>

	<label for="marka">Марка и модел:</label>
    	<input type="text" id="text" required>

    <label for="poraka">Дополнителна информација:</label>
    <textarea id="poraka"></textarea>

    <button type="submit">Закажи</button>
</form>

<script>
function sendEmail() {
    const emailTo = "motoserviskumanovo@gmail.com";  // <-- PUT YOUR EMAIL HERE

    const ime = document.getElementById("ime").value;
    const email = document.getElementById("email").value;
    const telefon = document.getElementById("telefon").value;
    const datum = document.getElementById("datum").value;
    const tip = document.getElementById("tip").value;
    const marka = document.getElementById("marka").value;
    const poraka = document.getElementById("poraka").value;

    const subject = "Ново Закажување за Сервис";
    const body = 
        "Име и Презиме: " + ime + "%0D%0A" +
        "Е-пошта: " + email + "%0D%0A" +
        "Телефон: " + telefon + "%0D%0A" +
        "Датум: " + datum + "%0D%0A" +
        "Тип на сервис: " + tip + "%0D%0A" +
	"Марка и модел: " + marka; +
        "Порака: " + poraka;

    window.location.href = `mailto:${emailTo}?subject=${subject}&body=${body}`;
}
</script>

           

    <footer>
        © 2025 Мото Сервис Kumanovo. Сите права задржани.
    </footer>
</body>
</html>
