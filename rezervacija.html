<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закажи сервис - Мото Сервис Kumanovo</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <h1>Мото Сервис Kumanovo</h1>
        </a>
        <nav>
            <a href="index.html">Почетна</a>
            <a href="rezervacija.html">Закажи</a>
        </nav>
    </header>

    <section id="rezervacija" class="section">
        <h2>Закажи сервис</h2>
        <form id="contactForm" class="reservation-form">
            <label for="ime">Име и Презиме:</label>
            <input type="text" id="ime" name="name" placeholder="Вашето име" required />

            <label for="email">Е-пошта:</label>
            <input type="email" id="email" name="email" placeholder="Вашата е-пошта" required />

            <label for="telefon">Телефон:</label>
            <input type="tel" id="telefon" name="phone" placeholder="Телефон" required />

            <label for="datum">Датум на закажување:</label>
            <input type="date" id="datum" name="date" required />

            <label for="marka_model">Марка и Модел на мотор:</label>
            <input type="text" id="marka_model" name="motorcycle" placeholder="Марка и модел на мотор" required />

            <label for="тип">Тип на сервис:</label>
            <select id="тип" name="serviceType">
                <option value="редовен">Редовен сервис</option>
                <option value="поправка">Поправка</option>
                <option value="дијагностика">Дијагностика</option>
            </select>

            <label for="порака">Дополнителни информации:</label>
            <textarea id="порака" name="message" placeholder="Порака"></textarea>

            <button type="submit">Закажи</button>
        </form>
    </section>

    <!-- EmailJS SDK -->
    <script src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("GM5Py8refjzlvQGpO"); // your public key
        })();

        document.getElementById("contactForm").addEventListener("submit", function(e) {
            e.preventDefault();

            emailjs.sendForm("service_tdylz45", "template_1611g0c", this)
            .then(() => {
                alert("Вашата порака е успешно пратена!");
                this.reset(); // clear form after sending
            }, (error) => {
                alert("Настана грешка. Обиди се повторно.");
                console.log(error);
            });
        });
    </script>

    <footer>
        © 2025 Мото Сервис Kumanovo. Сите права задржани.
    </footer>
</body>
</html>
