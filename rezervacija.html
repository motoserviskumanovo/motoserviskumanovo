<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закажи сервис - Мото Сервис Kumanovo</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
    <h1>Мото Сервис Kumanovo</h1>
</a>
        <nav>
            <a href="index.html">Почетна</a>
            <a href="rezervacija.html">Закажи</a>
        </nav>
    </header>

    <section id="rezervacija" class="section">
<h2>Закажи сервис</h2>
<form onsubmit="sendEmail(); return false;" class="reservation-form">
<label for="ime">Име и Презиме:</label>
<input type="text" id="ime" required />


<label for="email">Е-пошта:</label>
<input type="email" id="email" required />


<label for="telefon">Телефон:</label>
<input type="tel" id="telefon" required />


<label for="datum">Датум на закажување:</label>
<input type="date" id="datum" required />


<label for="marka_model">Марка и Модел на мотор:</label>
<input type="text" id="marka_model" required />


<label for="тип">Тип на сервис:</label>
<select id="тип">
<option value="редовен">Редовен сервис</option>
<option value="поправка">Поправка</option>
<option value="дијагностика">Дијагностика</option>
</select>


<label for="порака">Дополнителни информации:</label>
<textarea id="порака"></textarea>


<button type="submit">Закажи</button>
</form>
</section>


<script>
function sendEmail() {
const emailTo = "youremail@example.com"; // заменете со вашата е-пошта


const ime = document.getElementById("ime").value;
const email = document.getElementById("email").value;
const telefon = document.getElementById("telefon").value;
const datum = document.getElementById("datum").value;
const marka_model = document.getElementById("marka_model").value;
const tip = document.getElementById("тип").value;
const poraka = document.getElementById("порака").value;


const subject = encodeURIComponent("Ново закажување за сервис");
const body = encodeURIComponent(
`Име и Презиме: ${ime}\n` +
`Е-пошта: ${email}\n` +
`Телефон: ${telefon}\n` +
`Датум: ${datum}\n` +
`Марка и Модел: ${marka_model}\n` +
`Тип на сервис: ${tip}\n` +
`Порака: ${poraka}`
);


window.location.href = `mailto:${emailTo}?subject=${subject}&body=${body}`;
}
</script>

        © 2025 Мото Сервис Kumanovo. Сите права задржани.
    </footer>
</body>
</html>
